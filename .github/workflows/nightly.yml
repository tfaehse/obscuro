name: Nightly Tests

on:
  schedule:
    # Run at 2 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  extended-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        uv sync --group test

    - name: Run all tests including slow ones
      run: |
        uv run pytest --cov=src --cov-report=xml --cov-report=html -v

    - name: Run memory profiling tests
      run: |
        uv run python -m pytest --memray tests/ || true

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
        path: |
          coverage.xml
          htmlcov/

  compatibility-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Test with minimum dependency versions
      run: |
        # Install with minimum versions if specified
        uv sync --group test
        uv run pytest

    - name: Test with latest dependency versions
      run: |
        # Install with latest versions
        uv sync --group test --upgrade
        uv run pytest

  stress-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: |
        uv sync --group test

    - name: Run stress tests
      run: |
        # Run tests with high load
        uv run pytest -m "slow" --count=10 --tb=short

    - name: Run memory leak tests
      run: |
        # Test for memory leaks
        uv run pytest tests/ -k "memory" || true

  notification:
    runs-on: ubuntu-latest
    needs: [extended-tests, compatibility-tests, stress-tests]
    if: failure()

    steps:
    - name: Notify on failure
      run: |
        echo "Nightly tests failed! Check the workflow logs."
        # Add notification logic here (email, Slack, etc.)
