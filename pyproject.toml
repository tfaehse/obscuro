[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0", "wheel"]

[dependency-groups]
dev = [
  "ty>=0.0.1a15",
  "pre-commit>=3.7.0",
  "ruff>=0.5.6",
  "mypy>=1.10.0",
  "bandit>=1.7.9"
]
test = [
  "pytest>=8.0.0",
  "pytest-cov>=4.1.0",
  "pytest-asyncio>=0.23.0",
  "pytest-mock>=3.12.0",
  "httpx>=0.25.0",
  "pytest-xdist>=3.5.0",
  "coverage[toml]>=7.4.0"
]

[project]
authors = [
  {name = "Thomas Fähse", email = "tfaehse@proton.me"}
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
  "Topic :: Security"
]
dependencies = [
  "av>=11.0.0",
  "numpy>=1.26.4",
  "onnx>=1.16.0",
  "onnxruntime>=1.18.1",
  "platformdirs>=4.2.2",
  "imageio>=2.34.0",
  "opencv-python>=4.10.0.84",
  "polars>=1.10.0",
  "fastapi>=0.111.0",
  "omegaconf>=2.3.0",
  "onnxslim>=0.1.49",
  "python-multipart>=0.0.9",
  "pydantic-settings>=2.1.0",
  "toml>=0.10.0",
  "ultralytics>=8.2.0",
  "uvicorn>=0.30.0",
  "sse-starlette>=1.6.1",
  "filterpy>=1.4.5",
  "scipy>=1.11.0",
  "lap>=0.5.12",
  "sahi>=0.11.15",
  "onnxscript>=0.5.6"
]
description = "High-performance dashcam video anonymization with GUI and API capabilities"
keywords = ["video", "anonymization", "privacy", "dashcam", "ai", "computer-vision"]
license = {text = "AGPL-3.0-or-later"}
name = "obscuro"
requires-python = ">=3.12"
version = "0.1.0"

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.14.2"
]
gpu = [
  "onnxruntime-gpu>=1.18.1",
  "torch>=2.4.0",
  "torchvision>=0.19.0",
  "torchaudio>=2.4.0"
]

[project.scripts]
blur-api = "blur_api.serve:main"
blur-cli = "blur_cli.cli:main"

[tool.bandit]
exclude_dirs = ["tests", "build"]
skips = ["B101", "B601", "B104"]  # Skip assert_used, shell injection, and bind_all_interfaces

[tool.coverage]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug:",
  "if settings.DEBUG",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
  "class .*\\bProtocol\\):",
  "@(abc\\.)?abstractmethod"
]
precision = 2
show_missing = true
skip_covered = false

# Coverage configuration
[tool.coverage.run]
omit = [
  "*/tests/*",
  "*/test_*",
  "*/__pycache__/*",
  "*/.*",
  "setup.py",
  "*/frontend/*"
]
source = ["src"]

# Pytest configuration
[tool.pytest.ini_options]
addopts = [
  "-v",
  "--strict-markers",
  "--strict-config",
  "--cov=src",
  "--cov-report=term-missing",
  "--cov-report=html",
  "--cov-report=xml",
  "--cov-fail-under=80"
]
markers = [
  "integration: marks tests as integration tests"
]
python_classes = ["Test*"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = [
  "build/",
  "*.egg-info/",
  "__pycache__/"
]
line-length = 100
target-version = "py312"

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
ignore = [
  "E501",  # line too long, handled by formatter
  "B008",  # do not perform function calls in argument defaults
  "B904",  # Allow raising exceptions without from inside except
  "PTH123",  # Allow open() instead of Path.open() - sometimes more readable
  "SIM113",  # Allow manual loop counters when they're needed for specific logic
  "SIM102"  # Allow nested if statements when they're more readable
]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "RUF",  # Ruff-specific rules
  "SIM",  # flake8-simplify
  "PTH"  # flake8-use-pathlib
]

[tool.ruff.lint.isort]
known-first-party = ["anonymizer", "blur_api", "blur_cli"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py files

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"*" = ["*.txt", "*.md"]

[tool.setuptools.packages.find]
include = ["anonymizer", "anonymizer.*", "blur_api", "blur_api.*", "blur_cli", "blur_cli.*"]
where = ["src"]

[tool.ty.environment]
python-version = "3.12"
root = ["./src"]

[tool.ty.src]
include = ["src/**/*.py"]

[tool.uv]
package = true

[[tool.uv.index]]
explicit = true
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"

[tool.uv.sources]
torch = [
  {index = "pytorch-cu128", extra = "gpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'"}
]
torchaudio = [
  {index = "pytorch-cu128", extra = "gpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'"}
]
torchvision = [
  {index = "pytorch-cu128", extra = "gpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'"}
]
