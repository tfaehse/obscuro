<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Obscuro</title>
  <style>
    :root{
      --bg:#0f1320;
      --bg-alt:#0a101f;
      --panel:#141a2a;
      --panel-soft:#0f1628;
      --panel-sub:#10172a;
      --text:#e9eefc;
      --muted:#94a0bf;
      --muted-2:#697395;
      --accent:#3b82f6;
      --accent-strong:#5a9dff;
      --border:#1f2740;
      --border-soft:rgba(50,72,120,.45);
      --shadow:0 18px 44px rgba(3,6,18,.55);
      --radius-lg:18px;
      --radius:14px;
      --radius-sm:10px;
      --sidebar-width:380px;
      --control-height:40px;
    }
    *,*::before,*::after{box-sizing:border-box;}
    html,body{height:100%;}
    body{
      margin:0;
      background:linear-gradient(180deg,#0c1220 0%,#0a0f1b 55%,#081024 100%);
      color:var(--text);
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif;
      font-size:15px;
      line-height:1.4;
      min-width:1200px;
      min-height:760px;
      overflow:hidden;
    }
    button,select,input{
      font:inherit;
      color:inherit;
    }
    .hidden{display:none !important;}

    /* Top bar */
    .topbar{
      height:60px;
      display:flex;
      align-items:center;
      gap:14px;
      padding:0 22px;
      border-bottom:1px solid var(--border);
      background:rgba(13,18,32,.82);
      backdrop-filter:saturate(180%) blur(12px);
      position:sticky;
      top:0;
      z-index:20;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      font-weight:700;
      letter-spacing:.18em;
      text-transform:uppercase;
      user-select:none;
    }
    .brand *{
      user-select:none;
    }
    .brand-icon{
      width:36px;
      height:36px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.15);
      box-shadow:0 10px 24px rgba(59,130,246,.35);
      background:#05070d;
      padding:2px;
    }
    .brand-copy{
      display:flex;
      flex-direction:column;
      gap:2px;
      font-size:13px;
      letter-spacing:.12em;
    }
    .brand-copy span{
      font-size:15px;
    }
    .brand-copy small{
      font-size:10px;
      letter-spacing:.24em;
      text-transform:uppercase;
      color:var(--muted-2);
    }
    .topbar .spacer{flex:1;}

    .topbar-status{
      display:flex;
      align-items:center;
      gap:10px;
      padding:6px 14px;
      background:rgba(17,26,44,.85);
      border:1px solid rgba(255,255,255,.08);
      border-radius:14px;
      font-size:13px;
      color:var(--muted);
    }
    .topbar-status #backend-status-label{
      font-size:12px;
      letter-spacing:.06em;
      color:var(--text);
    }
    .topbar-actions{
      display:flex;
      align-items:center;
      gap:10px;
    }
    .topbar-actions .btn{
      width:38px;
      min-width:38px;
      height:38px;
      padding:0;
      display:grid;
      place-items:center;
    }
    .topbar-actions svg{
      width:18px;
      height:18px;
      fill:var(--muted);
      transition:fill .18s ease;
    }
    .topbar-actions .btn:hover svg,
    .topbar-actions .btn:focus-visible svg{
      fill:var(--accent);
    }

    .field{
      display:flex;
      align-items:center;
      gap:8px;
    }
    .field label{
      font-size:12px;
      color:var(--muted);
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    .btn{
      appearance:none;
      border:1px solid var(--border);
      background:#111a31;
      color:var(--text);
      border-radius:12px;
      padding:10px 16px;
      min-height:var(--control-height);
      font-size:14px;
      font-weight:500;
      cursor:pointer;
      transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
    }
    .btn:hover:not(:disabled){
      transform:translateY(-1px);
      border-color:var(--border-soft);
      box-shadow:0 12px 28px rgba(0,0,0,.35);
    }
    .btn:active:not(:disabled){
      transform:translateY(0);
    }
    .btn:disabled{
      opacity:.6;
      cursor:not-allowed;
    }
    .btn.primary{
      background:linear-gradient(135deg,var(--accent),var(--accent-strong));
      border-color:transparent;
      color:#031229;
      font-weight:600;
      box-shadow:0 16px 36px rgba(59,130,246,.42);
    }
    .btn.danger{
      background:#28121c;
      border-color:#44202f;
      color:#f3b6c8;
    }
    .btn.ghost{
      background:#101729;
    }
    .btn.icon{
      width:40px;
      min-width:40px;
      padding:0;
      display:grid;
      place-items:center;
      font-size:16px;
    }

    select{
      appearance:none;
      border:1px solid var(--border);
      background:var(--panel-sub);
      color:var(--text);
      border-radius:12px;
      padding:10px 36px 10px 14px;
      min-height:var(--control-height);
      position:relative;
      background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
      background-position:right 14px top calc(50% - 3px), right 14px top calc(50% + 3px);
      background-size:8px 8px;
      background-repeat:no-repeat;
    }
    select:focus{
      outline:none;
      border-color:var(--accent);
      box-shadow:0 0 0 3px rgba(59,130,246,.22);
    }

    /* Main layout */
    .app{
      min-height:calc(760px - 60px);
      height:calc(100vh - 60px);
      display:grid;
      grid-template-columns:minmax(560px,1fr) minmax(320px,var(--sidebar-width));
      gap:18px;
      padding:18px;
      align-items:stretch;
      overflow:hidden;
    }

    /* Stage */
    .stage{
      position:relative;
      padding:0;
      display:flex;
      flex-direction:column;
      height:100%;
      overflow:hidden;
    }
    .stage-shell{
      position:relative;
      flex:1;
      width:100%;
      background:rgba(17,26,44,.95);
      border-radius:24px;
      box-shadow:0 30px 60px rgba(3,6,16,.55);
      padding:28px;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }
    .stage-shell::before{
      content:"";
      position:absolute;
      top:26px;
      left:26px;
      width:72px;
      height:72px;
      background:url('./icon.png') center/contain no-repeat;
      opacity:0.08;
      filter:drop-shadow(0 18px 32px rgba(0,0,0,.45));
      pointer-events:none;
    }
    #video-container{
      position:relative;
      width:100%;
      max-width:100%;
      height:auto;
      max-height:calc(100vh - 60px - 36px - 56px);
      width:min(100%, calc((100vh - 60px - 36px - 56px) * (16 / 9)));
      aspect-ratio:16/9;
      border-radius:16px;
      overflow:hidden;
      background:radial-gradient(circle at 25% 15%,rgba(59,130,246,.28),transparent 55%), #05070d;
      outline:1px solid rgba(255,255,255,.06);
      display:block;
      margin:0 auto;
    }
    #video-container.drag-over{
      outline:2px dashed var(--accent);
      outline-offset:6px;
    }
    #video-wrapper{
      position:absolute;
      inset:0;
      overflow:hidden;
    }
    #video-preview,
    #overlay-image{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
    }
    #overlay-image{
      position:absolute;
      inset:0;
      pointer-events:none;
    }
    #placeholder-image{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      filter:brightness(.85);
      transition:opacity .25s ease;
      pointer-events:none;
    }
    #placeholder-image.hidden{
      opacity:0;
      pointer-events:none;
    }
    #loading-spinner{
      position:absolute;
      top:50%;
      left:50%;
      width:48px;
      height:48px;
      margin:-24px 0 0 -24px;
      border:4px solid rgba(255,255,255,.08);
      border-top:4px solid var(--accent);
      border-radius:50%;
      animation:spin 1s linear infinite;
      z-index:5;
    }
    @keyframes spin{
      to{transform:rotate(360deg);}
    }

    .video-overlay{
      position:absolute;
      inset:auto 18px 18px;
      padding:12px 16px 14px;
      background:linear-gradient(180deg,rgba(6,10,20,.08) 0%,rgba(6,10,20,.78) 85%);
      border-radius:16px;
      border:1px solid rgba(255,255,255,.08);
      box-shadow:0 18px 32px rgba(2,6,14,.55);
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .media-row{
      display:flex;
      align-items:center;
      gap:12px;
    }
    .media-buttons{
      display:flex;
      align-items:center;
      gap:6px;
    }
    .media-btn{
      width:36px;
      height:36px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(10,15,28,.75);
      color:var(--text);
      font-size:13px;
      cursor:pointer;
      transition:background .18s ease, border-color .18s ease, color .18s ease;
    }
    .media-btn.primary{
      width:44px;
      height:44px;
      background:var(--accent);
      border-color:transparent;
      color:#041224;
      font-weight:600;
      box-shadow:0 14px 28px rgba(59,130,246,.4);
    }
    .media-btn:hover:not(:disabled){
      border-color:var(--accent);
      color:var(--accent);
    }
    .media-btn:disabled{
      opacity:.5;
      cursor:not-allowed;
    }
    .timecode{
      margin-left:auto;
      font-size:12px;
      color:var(--muted);
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .timeline{
      width:100%;
      appearance:none;
      height:5px;
      border-radius:999px;
      background:#1f2433;
      outline:none;
    }
    .timeline::-webkit-slider-thumb{
      appearance:none;
      width:14px;
      height:14px;
      border-radius:50%;
      background:var(--accent);
      border:2px solid #fff;
      box-shadow:0 0 0 6px rgba(59,130,246,.25);
    }
    .timeline::-moz-range-thumb{
      width:14px;
      height:14px;
      border-radius:50%;
      background:var(--accent);
      border:2px solid #fff;
      box-shadow:0 0 0 6px rgba(59,130,246,.25);
    }
    .status-row{
      display:flex;
      justify-content:flex-end;
    }
    .status-row .chip{
      font-size:11px;
      letter-spacing:.04em;
      text-transform:none;
    }
    .chip{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:4px 10px;
      border-radius:999px;
      background:#111a31;
      border:1px solid rgba(255,255,255,.08);
      color:var(--muted);
      font-size:12px;
      letter-spacing:.04em;
      text-transform:uppercase;
    }

    /* Sidebar */
    .sidebar{
      background:var(--panel);
      border-radius:var(--radius-lg);
      box-shadow:var(--shadow);
      display:flex;
      flex-direction:column;
      overflow:hidden;
      min-width:320px;
      height:100%;
    }
    .sidebar-scroll{
      flex:1;
      display:flex;
      flex-direction:column;
      overflow:auto;
    }
    .group{
      padding:18px 18px 16px;
      border-bottom:1px solid rgba(12,18,34,.65);
      background:rgba(15,22,40,.85);
    }
    .group:last-of-type{
      border-bottom:none;
    }
    .group h4{
      margin:0 0 12px;
      font-size:13px;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:#c4d0ff;
    }
    .group .help{
      font-size:12px;
      color:var(--muted);
    }
    .status-dot{
      width:12px;
      height:12px;
      border-radius:50%;
      background:#4b5563;
      box-shadow:0 0 0 1px rgba(255,255,255,.18);
    }
    .status-dot.ok{background:#34d399;}
    .status-dot.err{background:#f87171;}
    .status-dot.connecting{
      background:#9ca3af;
      animation:pulse 1.2s ease-in-out infinite alternate;
    }
    @keyframes pulse{
      from{opacity:.45;}
      to{opacity:1;}
    }
    .progress-display{
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .progress-group progress{
      width:100%;
      height:10px;
      border-radius:999px;
      border:none;
      background:#0e1424;
      overflow:hidden;
      display:block;
    }
    .progress-group progress::-webkit-progress-bar{
      background:#11182e;
    }
    .progress-group progress::-webkit-progress-value{
      background:linear-gradient(90deg,var(--accent),var(--accent-strong));
      border-radius:999px;
    }
    .progress-group progress::-moz-progress-bar{
      background:linear-gradient(90deg,var(--accent),var(--accent-strong));
      border-radius:999px;
    }
    .progress-text{
      font-size:13px;
      color:var(--muted);
      letter-spacing:.05em;
    }

    .tabs{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      padding:14px 18px;
      border-bottom:1px solid rgba(12,18,34,.65);
      background:rgba(12,18,34,.8);
    }
    .tab-btn{
      padding:8px 14px;
      border-radius:12px;
      border:1px solid var(--border);
      background:#0f162a;
      color:var(--muted);
      cursor:pointer;
      transition:background .18s ease, border-color .18s ease, color .18s ease;
    }
    .tab-btn.active{
      color:var(--text);
      border-color:var(--accent);
      background:rgba(59,130,246,.18);
    }

    .panel{
      flex:1;
      overflow:auto;
      padding:18px;
      background:rgba(11,18,32,.78);
      display:flex;
      flex-direction:column;
      gap:14px;
    }
    .tab-panel{
      background:rgba(9,14,26,.92);
      border:1px solid rgba(31,41,69,.72);
      border-radius:16px;
      padding:18px 18px 20px;
      display:flex;
      flex-direction:column;
      gap:16px;
    }
    .tab-panel:not(.active){
      display:none;
    }
    .tab-panel h5{
      margin:0;
      font-size:12px;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:#c9d6ff;
    }
    .control{
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .control .btn{
      width:100%;
      justify-content:space-between;
    }
    .control label{
      font-size:13px;
      color:var(--muted);
      letter-spacing:.04em;
    }
    .control input[type=text],
    .control input[type=number],
    .control input[type=range],
    .control select,
    .control textarea{
      width:100%;
      border-radius:12px;
      border:1px solid var(--border);
      background:var(--panel-sub);
      color:var(--text);
      padding:10px 12px;
      font-size:14px;
      transition:border-color .18s ease, box-shadow .18s ease;
    }
    .control input[type=range]{
      padding:0;
      min-height:auto;
      accent-color:var(--accent);
    }
    .control input[type=text]:focus,
    .control input[type=number]:focus,
    .control select:focus,
    .control textarea:focus{
      outline:none;
      border-color:var(--accent);
      box-shadow:0 0 0 3px rgba(59,130,246,.2);
    }
    .control input[type=checkbox]{
      width:20px;
      height:20px;
      accent-color:var(--accent);
    }
    .inline{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
    }
    .inline .btn{
      flex:1 1 auto;
    }
    .model-manager{
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .model-list{
      display:flex;
      flex-direction:column;
      gap:8px;
      max-height:190px;
      overflow:auto;
      padding-right:4px;
    }
    .model-item{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      border-radius:12px;
      border:1px solid rgba(31,41,69,.75);
      background:#111a31;
      padding:10px 12px;
      transition:border-color .18s ease, transform .18s ease;
    }
    .model-item:hover{
      transform:translateY(-1px);
      border-color:var(--accent);
    }
    .model-item.active{
      border-color:var(--accent);
      background:rgba(16,26,46,.95);
    }
    .model-item .meta{
      display:flex;
      flex-direction:column;
      gap:2px;
      font-size:13px;
    }
    .model-item .badge{
      font-size:11px;
      color:var(--muted-2);
    }
    .model-item .actions{
      display:flex;
      gap:6px;
    }
    .model-item .actions .btn{
      min-height:30px;
      padding:6px 10px;
      font-size:12px;
    }
    pre{
      margin:0;
      background:#090f20;
      border:1px solid rgba(31,41,69,.72);
      border-radius:12px;
      padding:12px;
      color:#cfd9ff;
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      font-size:12px;
      max-height:200px;
      overflow:auto;
    }

    @media (max-width:1180px){
      :root{--sidebar-width:320px;}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="./icon.png" alt="Obscuro icon" class="brand-icon" width="36" height="36" />
      <div class="brand-copy">
        <span>Obscuro</span>
        <small>Video anonymizer</small>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="topbar-status">
      <span id="backend-status-dot" class="status-dot connecting" title="Backend status"></span>
      <span id="backend-status-label">connecting…</span>
    </div>
    <div class="topbar-actions">
      <button class="btn icon ghost" id="backend-restart-btn" type="button" title="Restart backend" aria-label="Restart backend">&#8635;</button>
      <button class="btn icon ghost" id="backend-manage-btn" type="button" title="Backend settings" aria-label="Backend settings">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.78 1.78 0 0 0 .35 1.95l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.78 1.78 0 0 0-1.95-.35 1.78 1.78 0 0 0-1 1.61V21a2 2 0 0 1-4 0v-.09a1.78 1.78 0 0 0-1-1.61 1.78 1.78 0 0 0-1.95.35l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.78 1.78 0 0 0 .35-1.95 1.78 1.78 0 0 0-1.61-1H3a2 2 0 0 1 0-4h.09a1.78 1.78 0 0 0 1.61-1 1.78 1.78 0 0 0-.35-1.95l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.78 1.78 0 0 0 1.95.35h.02a1.78 1.78 0 0 0 1-1.61V3a2 2 0 0 1 4 0v.09a1.78 1.78 0 0 0 1 1.61h.02a1.78 1.78 0 0 0 1.95-.35l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.78 1.78 0 0 0-.35 1.95v.02a1.78 1.78 0 0 0 1.61 1H21a2 2 0 0 1 0 4h-.09a1.78 1.78 0 0 0-1.61 1Z"></path>
        </svg>
      </button>
    </div>
    <input type="file" id="video-upload" accept="video/*,.mkv" class="hidden" />
    <button class="btn" id="select-video-btn" type="button">Select video</button>
    <button class="btn primary" id="start-processing" type="button">Start</button>
    <button class="btn danger hidden" id="cancel-processing" type="button">Cancel</button>
  </header>

  <main class="app">
    <section class="stage">
      <div class="stage-shell">
        <div id="video-container">
          <div id="video-wrapper">
            <img id="placeholder-image" src="./media/placeholder.png" alt="Preview placeholder" />
            <video id="video-preview" preload="metadata"></video>
            <img id="overlay-image" alt="" />
            <div id="loading-spinner" class="hidden"></div>
          </div>
          <div class="video-overlay">
            <div class="media-row">
              <div class="media-buttons">
                <button class="media-btn" id="prev-frame-btn" type="button" title="Frame back">◀</button>
                <button class="media-btn primary" id="play-pause-btn" type="button" title="Play or pause">
                  <span id="play-icon">▶</span>
                  <span id="pause-icon" class="hidden">⏸</span>
                </button>
                <button class="media-btn" id="next-frame-btn" type="button" title="Frame forward">▶</button>
              </div>
              <span class="timecode" id="duration-display">0:00 / 0:00</span>
            </div>
            <input class="timeline" type="range" id="scrub-range" min="0" value="0" step="0.1" />
            <div class="status-row">
              <span class="chip" id="frame-display">Frame 0 / 0</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <aside class="sidebar">
      <div class="sidebar-scroll">
        <section class="group progress-group">
          <h4>Progress</h4>
          <div class="progress-display">
            <progress id="progress-bar" value="0" max="100"></progress>
            <div class="progress-text" id="progress-status">Select a video to begin</div>
          </div>
        </section>

        <nav class="tabs" role="tablist">
          <button class="tab-btn active" role="tab" aria-selected="true" data-panel-target="model">Model</button>
          <button class="tab-btn" role="tab" aria-selected="false" data-panel-target="blur">Blur</button>
          <button class="tab-btn" role="tab" aria-selected="false" data-panel-target="detection">Detection</button>
          <button class="tab-btn" role="tab" aria-selected="false" data-panel-target="tracking">Tracking</button>
          <button class="tab-btn" role="tab" aria-selected="false" data-panel-target="video">Output</button>
          <button class="tab-btn" role="tab" aria-selected="false" data-panel-target="advanced">Advanced</button>
          <button class="tab-btn" role="tab" aria-selected="false" data-panel-target="debug">Debug</button>
        </nav>

        <div class="panel">
          <section class="tab-panel active" data-panel="model">
            <div class="control">
              <label for="model-select">Active model</label>
              <select id="model-select" class="select"></select>
            </div>
            <div class="model-manager">
              <input id="model-upload-input" type="file" accept=".onnx" hidden />
              <button class="btn ghost" id="model-upload-button" type="button">Add model (.onnx)</button>
              <div id="model-list" class="model-list"></div>
            </div>
          </section>

          <section class="tab-panel" data-panel="blur" hidden>
            <div class="control">
              <label for="blur-type">Blur type</label>
              <select id="blur-type" class="select">
                <option value="gaussian">Gaussian</option>
                <option value="pixelate">Pixelate</option>
                <option value="blackout">Blackout</option>
                <option value="black">Black Box</option>
                <option value="debug">Debug Overlay</option>
              </select>
            </div>
            <div class="control">
              <label for="blur-strength">Strength <span id="blur-strength-value" class="chip" style="text-transform:none;">10</span></label>
              <input id="blur-strength" type="range" min="1" max="100" value="10" />
            </div>
          </section>

          <section class="tab-panel" data-panel="detection" hidden>
            <div class="control">
              <label for="detection-threshold">Detection threshold <span id="detection-threshold-value" class="chip" style="text-transform:none;">0.5</span></label>
              <input id="detection-threshold" type="range" min="0" max="1" step="0.01" value="0.5" />
            </div>
            <div class="control">
              <label for="low-score-threshold">Low score threshold <span id="low-score-threshold-value" class="chip" style="text-transform:none;">0.1</span></label>
              <input id="low-score-threshold" type="range" min="0" max="1" step="0.01" value="0.1" />
            </div>
            <div class="control">
              <label for="batch-size">Batch size <span id="batch-size-value" class="chip" style="text-transform:none;">8</span></label>
              <input id="batch-size" type="range" min="1" max="256" step="1" value="8" />
              <p class="hint hidden" id="batch-size-lock-hint">Batch size is fixed to 1 for this model.</p>
            </div>
            <div class="control">
              <label for="single-pass">Single pass (single tile)</label>
              <input id="single-pass" type="checkbox" />
            </div>
            <div class="control">
              <label for="inference-size">Inference size <span id="inference-size-value" class="chip" style="text-transform:none;">1920</span></label>
              <input id="inference-size" type="number" min="256" max="8192" step="64" value="1920" />
            </div>
            <div class="control">
              <label for="sahi-overlap">SAHI overlap <span id="sahi-overlap-value" class="chip" style="text-transform:none;">0.20</span></label>
              <input id="sahi-overlap" type="range" min="0" max="0.9" step="0.01" value="0.2" />
            </div>
            <div class="control">
              <div class="control-header">
                <label>Classes to blur</label>
                <button id="reset-classes" class="btn ghost" type="button">Reset defaults</button>
              </div>
              <div id="class-toggle-list" class="chip-row"></div>
            </div>
          </section>

          <section class="tab-panel" data-panel="tracking" hidden>
            <div class="control">
              <label for="tracker-type">Tracker</label>
              <select id="tracker-type" class="select">
                <option value="dummy">Dummy (no tracking)</option>
                <option value="bytetrack" selected>ByteTrack</option>
                <option value="botsort">BoT-SORT</option>
                <option value="hybrid_sot">Hybrid SOT</option>
              </select>
            </div>
            <div class="control">
              <label for="track-offline-linker">Offline linker</label>
              <input id="track-offline-linker" type="checkbox" />
            </div>
            <div class="control" data-scope="dummy">
              <label for="tracker-ema-alpha">EMA α <span id="tracker-ema-alpha-value" class="chip" style="text-transform:none;">0.6</span></label>
              <input id="tracker-ema-alpha" type="range" min="0" max="1" step="0.01" value="0.6" />
            </div>
            <div class="control" data-scope="bytetrack,botsort,hybrid_sot">
              <label for="track-distance-gate">Distance gate <span id="track-distance-gate-value" class="chip" style="text-transform:none;">0.4</span></label>
              <input id="track-distance-gate" type="range" min="0.05" max="1" step="0.01" value="0.4" />
            </div>
            <div class="control">
              <label for="track-confirm-after">Confirm after <span id="track-confirm-after-value" class="chip" style="text-transform:none;">2</span></label>
              <input id="track-confirm-after" type="range" min="1" max="5" step="1" value="2" />
            </div>
            <div class="control">
              <label for="track-max-misses">Max misses <span id="track-max-misses-value" class="chip" style="text-transform:none;">10</span></label>
              <input id="track-max-misses" type="range" min="1" max="30" step="1" value="10" />
            </div>
            <div class="control" data-scope="bytetrack,botsort">
              <label for="track-low-score-pool">Low-score pool</label>
              <input id="track-low-score-pool" type="checkbox" />
            </div>
            <div class="control" data-scope="bytetrack,botsort">
              <label for="track-low-score-delta">Low-score delta <span id="track-low-score-delta-value" class="chip" style="text-transform:none;">0.2</span></label>
              <input id="track-low-score-delta" type="range" min="0" max="0.5" step="0.01" value="0.2" />
            </div>
            <div class="control" data-scope="botsort">
              <label for="track-distance-high">Distance hi <span id="track-distance-high-value" class="chip" style="text-transform:none;">0.6</span></label>
              <input id="track-distance-high" type="range" min="0" max="1" step="0.01" value="0.6" />
            </div>
            <div class="control" data-scope="botsort">
              <label for="track-distance-low">Distance lo <span id="track-distance-low-value" class="chip" style="text-transform:none;">0.3</span></label>
              <input id="track-distance-low" type="range" min="0" max="1" step="0.01" value="0.3" />
            </div>
            <div class="control" data-scope="botsort">
              <label for="track-reid-weight">ReID weight <span id="track-reid-weight-value" class="chip" style="text-transform:none;">0.5</span></label>
              <input id="track-reid-weight" type="range" min="0" max="1" step="0.01" value="0.5" />
            </div>
            <div class="control" data-scope="botsort">
              <label for="track-cosine-gate">Cosine gate <span id="track-cosine-gate-value" class="chip" style="text-transform:none;">0.25</span></label>
              <input id="track-cosine-gate" type="range" min="0" max="1" step="0.01" value="0.25" />
            </div>
            <div class="control" data-scope="botsort">
              <label for="track-cam-motion">Camera motion compensation</label>
              <input id="track-cam-motion" type="checkbox" />
            </div>
            <div class="control" data-scope="botsort">
              <label for="track-flow-backend">Flow backend</label>
              <select id="track-flow-backend" class="select">
                <option value="LK">LK</option>
                <option value="RLOF">RLOF</option>
              </select>
            </div>
            <div class="control" data-scope="hybrid_sot">
              <label for="track-vt-backend">Visual tracker backend</label>
              <select id="track-vt-backend" class="select">
                <option value="TrackerNano">TrackerNano</option>
                <option value="CSRT">CSRT</option>
                <option value="KCF">KCF</option>
                <option value="SiamRPN">SiamRPN (experimental)</option>
              </select>
            </div>
            <div class="control" data-scope="hybrid_sot">
              <label for="track-use-visual">Enable visual tracker</label>
              <input id="track-use-visual" type="checkbox" />
            </div>
            <div class="control" data-scope="hybrid_sot">
              <label for="track-vt-max-age">VT max age <span id="track-vt-max-age-value" class="chip" style="text-transform:none;">6</span></label>
              <input id="track-vt-max-age" type="range" min="0" max="60" step="1" value="6" />
            </div>
            <div class="control">
              <label for="track-bbox-dilate">Dilate % <span id="track-bbox-dilate-value" class="chip" style="text-transform:none;">0.2</span></label>
              <input id="track-bbox-dilate" type="range" min="0.05" max="0.4" step="0.01" value="0.2" />
            </div>
            <div class="control">
              <label for="track-temporal-alpha">Smooth α <span id="track-temporal-alpha-value" class="chip" style="text-transform:none;">0.6</span></label>
              <input id="track-temporal-alpha" type="range" min="0" max="1" step="0.01" value="0.6" />
            </div>
            <div class="control" data-scope="hybrid_sot">
              <label for="track-drift-gate">Drift gate (rel) <span id="track-drift-gate-value" class="chip" style="text-transform:none;">0.15</span></label>
              <input id="track-drift-gate" type="range" min="0" max="1" step="0.01" value="0.15" />
            </div>
          </section>

          <section class="tab-panel" data-panel="video" hidden>
            <div class="control">
              <label for="video-codec">Codec</label>
              <select id="video-codec" class="select">
                <option value="h264">H.264</option>
                <option value="hevc">HEVC</option>
                <option value="vp8">VP8</option>
                <option value="vp9">VP9</option>
              </select>
            </div>
            <div class="control">
              <label for="video-quality">Quality <span id="video-quality-value" class="chip" style="text-transform:none;">auto</span></label>
              <input id="video-quality" type="range" min="1" max="51" value="23" disabled />
            </div>
            <div class="control">
              <label for="video-quality-override">Override quality</label>
              <input id="video-quality-override" type="checkbox" />
            </div>
          </section>

          <section class="tab-panel" data-panel="advanced" hidden>
            <div class="control">
              <label for="debug-mode">Debug mode</label>
              <input id="debug-mode" type="checkbox" />
            </div>
            <div class="control">
              <label for="log-level">Log level</label>
              <select id="log-level" class="select">
                <option value="DEBUG">Debug</option>
                <option value="INFO" selected>Info</option>
                <option value="WARNING">Warning</option>
                <option value="ERROR">Error</option>
              </select>
            </div>
          </section>

          <section class="tab-panel" data-panel="debug" hidden>
            <div class="control">
              <label>Configuration snapshot</label>
              <pre id="debug-config">{}</pre>
            </div>
          </section>
        </div>
      </div>
    </aside>
  </main>

  <canvas id="hidden-canvas" class="hidden"></canvas>
  <script type="module" src="../../dist/renderer/main.js"></script>
</body>
</html>
