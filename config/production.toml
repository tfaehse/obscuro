# Production Configuration
# Optimized for quality and performance

# Global settings
debug = false
log_level = "INFO"

[blur]
strength = 20  # Stronger blur for production
type = "gaussian"

[detection]
face_threshold = 0.6
plate_threshold = 0.7  # Higher threshold for production

[model]
# Use the bundled default model or point to a custom checkpoint.
name = "1280_nano"

[tracking]
type = "botsort"
use_offline_linker = true

[tracking.params]
bbox_dilate_pct = 0.2
cam_motion_comp = true
confirm_after_N = 2
cosine_gate = 0.25
distance_gate_hi = 0.6
distance_gate_lo = 0.3
flow_backend = "LK"
high_thresh = 0.6
low_score_pool_delta = 0.2
low_thresh = 0.2
max_misses_M = 10
offline_linker_max_misses = 30
offline_linker_per_frame_gate = 0.05
reid_weight = 0.5
temporal_smooth_alpha = 0.65
use_low_score_pool = true

[video]
codec = "h264"
quality = 20  # Higher quality for production
