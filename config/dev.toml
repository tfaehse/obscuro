# Development Configuration
# Optimized for development and testing

# Global settings
debug = true
log_level = "DEBUG"

[blur]
strength = 10
type = "gaussian"

[detection]
confidence_threshold = 0.4
low_score_threshold = 0.1  # Lower threshold for development

[model]
# Use the bundled default model or point to a custom checkpoint.
name = "1280_nano_seg"

[tracking]
type = "dummy"
use_offline_linker = true

[tracking.params]
bbox_dilate_pct = 0.15
ema_alpha = 0.6
offline_linker_max_misses = 30
offline_linker_per_frame_gate = 0.05
temporal_smooth_alpha = 0.7

[video]
codec = "h264"
quality = 28  # Faster encoding for development
